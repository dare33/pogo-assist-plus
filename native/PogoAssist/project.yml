# XcodeGen spec for the Pogo Assist+ app. Regenerate with `xcodegen generate` in this folder;
# the generated PogoAssist.xcodeproj is committed too. Identifiers live in Config/Identifiers.xcconfig.
name: PogoAssist
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Identifiers.xcconfig
  Release: Config/Identifiers.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only for v1 (Greg, 8 Oct 2026): nothing has been laid out for iPad, and App Store Connect refuses an iPad-capable archive that is portrait-only.
    # Repeated on each target below: xcodegen writes its own iPhone-and-iPad default per target, which would win over this line.
    TARGETED_DEVICE_FAMILY: "1"
packages:
  PogoReader:
    path: ../PogoReader
targets:
  PogoAssist:
    type: application
    platform: iOS
    sources:
      - PogoAssist
      - Shared
    dependencies:
      - package: PogoReader
        product: PogoReader
      # The app core (JavaScript engine, box, merge). App target only: the extension must stay small.
      - package: PogoReader
        product: PogoBox
      - target: PogoBroadcast
        embed: true
    entitlements:
      path: PogoAssist/PogoAssist.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: PogoAssist/Info.plist
      properties:
        CFBundleDisplayName: Pogo Assist+
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Figtree (OFL), one variable font: the weight axis gives 400 to 800. See UI/Typography.swift.
        UIAppFonts: [Figtree-Variable.ttf]
        AppGroupID: $(APP_GROUP)
        BroadcastExtensionID: $(EXTENSION_BUNDLE_ID)
        # "Make scans better": where reports go. Both come from the git-ignored Config/Signing.local.xcconfig; unset or placeholder hides the button.
        ScanReportURL: $(SCAN_REPORT_URL)
        ScanReportKey: $(SCAN_REPORT_KEY)
        # Export compliance: the app uses no encryption of its own (no network, no account), so App Store Connect need not ask per build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # AppIcon.appiconset: the 1024 light, dark and tinted icons (design of 7 Oct 2026); iOS 26 renders its glass treatment from the flat light icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PogoBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - PogoBroadcast
      - Shared
    dependencies:
      - package: PogoReader
        product: PogoReader
    entitlements:
      path: PogoBroadcast/PogoBroadcast.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    info:
      path: PogoBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Pogo Broadcast
        AppGroupID: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EXTENSION_BUNDLE_ID)
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  PogoAssistUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PogoAssistUITests
    dependencies:
      - target: PogoAssist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
# Run and Profile build Release: the pixel work is about 40 times slower unoptimised (158 ms against 4 ms a
# frame), which would make a device run say nothing about the real extension. Release keeps debug symbols
# (dSYM) and os_log output is visible in Console either way.
schemes:
  PogoAssist:
    build:
      targets:
        PogoAssist: all
    run:
      config: Release
    profile:
      config: Release
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - PogoAssistUITests
